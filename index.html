<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INTP 雲端財務戰情室 V6.3</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg-main: #090d16;
            --bg-card: #131a26;
            --bg-input: #0f141f;
            --border-color: rgba(255, 255, 255, 0.06);
            --accent-purple: #a855f7;
            --accent-blue: #38bdf8;
            --accent-warning: #f59e0b;
            --text-positive: #10b981;
            --text-negative: #ff7597;
            --text-main: #f1f5f9;
            --text-muted: #64748b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container { max-width: 1400px; width: 95%; }

        .header-section { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; width: 100%; }
        h1 { font-size: 2rem; font-weight: 700; letter-spacing: -0.03em; color: var(--text-main); }
        h1 span { color: var(--accent-purple); }
        .exchange-badge { background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.2); padding: 10px 20px; border-radius: 20px; font-size: 0.95rem; color: var(--accent-blue); font-weight: 600; }
        
        .dashboard { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 22px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2); transition: transform 0.2s; display: flex; flex-direction: column; justify-content: center; }
        .card:hover { transform: translateY(-4px); }
        .card h3 { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        .card .amount { font-size: 1.6rem; font-weight: 700; font-family: 'Poppins', sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .milestone-section { margin-bottom: 30px; }
        .panel-title { font-size: 1.2rem; font-weight: 600; margin-bottom: 15px; color: var(--text-main); display: flex; align-items: center; gap: 10px; }
        
        .current-level-banner {
            background: linear-gradient(145deg, rgba(245, 158, 11, 0.1), rgba(245, 158, 11, 0.02));
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            margin-bottom: 20px;
            position: relative;
        }
        .current-level-banner h4 { color: var(--accent-warning); font-size: 0.9rem; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 2px;}
        .current-level-banner .title { font-size: 2rem; font-weight: 700; color: #fff; margin-bottom: 8px; }
        .current-level-banner .desc { font-size: 1rem; color: var(--text-muted); margin-bottom: 15px; }
        
        .stage-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; }
        .stage-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 22px; position: relative; display: flex; flex-direction: column; }
        .stage-card.active { border: 1px solid var(--accent-blue); background: linear-gradient(180deg, rgba(56, 189, 248, 0.05) 0%, rgba(19, 26, 38, 0) 100%); }
        .stage-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .stage-name { font-weight: 700; font-size: 1.1rem; color: var(--text-main); }
        .stage-target { font-size: 0.9rem; color: var(--text-muted); font-family: 'Poppins', sans-serif; }
        
        .progress-info { display: flex; justify-content: flex-end; font-size: 0.85rem; color: var(--accent-blue); margin-bottom: 8px; font-family: 'Poppins', sans-serif; font-weight: 600; }
        .progress-track { width: 100%; height: 8px; background: rgba(255,255,255,0.08); border-radius: 10px; overflow: hidden; margin-bottom: 15px; }
        .progress-fill { height: 100%; border-radius: 10px; transition: width 0.8s ease-out; }
        
        .strategy-list { font-size: 0.85rem; color: var(--text-muted); line-height: 1.6; list-style: none; flex-grow: 1; }
        .strategy-list li { margin-bottom: 8px; display: flex; align-items: flex-start; gap: 8px; }
        .strategy-list li i { margin-top: 4px; font-size: 0.7rem; }
        .strategy-list strong { color: #e2e8f0; }

        .charts-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 30px; }
        .chart-box { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 25px; display: flex; flex-direction: column; }
        .chart-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 25px; color: var(--text-main); display: flex; align-items: center; gap: 10px; }
        
        .donut-layout { display: flex; align-items: center; justify-content: space-between; flex-grow: 1; }
        .donut-wrapper { position: relative; width: 190px; height: 190px; display: flex; align-items: center; justify-content: center; }
        .donut-center { position: absolute; text-align: center; pointer-events: none; z-index: 5; }
        .donut-center .label { font-size: 0.85rem; color: var(--text-muted); }
        .donut-center .val { font-size: 1.6rem; font-weight: 700; color: var(--text-positive); font-family: 'Poppins', sans-serif; }
        .custom-legend { flex: 1; margin-left: 25px; list-style: none; display: flex; flex-direction: column; gap: 10px; }
        .legend-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background: rgba(255, 255, 255, 0.02); border-radius: 10px; border: 1px solid transparent; }
        .legend-dot { width: 10px; height: 10px; border-radius: 50%; margin-right: 10px; display: inline-block; }
        .legend-name { font-size: 0.95rem; color: var(--text-main); }
        .legend-pct { font-size: 0.95rem; font-weight: 700; font-family: 'Poppins', sans-serif; color: var(--accent-blue); }

        .input-panel { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 25px; margin-bottom: 30px; }
        .form-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 15px; margin-bottom: 20px; }
        .input-field label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px; font-weight: 600; }
        .input-field input { width: 100%; background: var(--bg-input); border: 1px solid rgba(255, 255, 255, 0.08); color: #fff; padding: 12px 15px; border-radius: 10px; font-size: 0.95rem; }
        .input-field input:focus { outline: none; border-color: var(--accent-purple); }
        .submit-btn { width: 100%; padding: 15px; background: linear-gradient(135deg, #a855f7, #7c3aed); color: #fff; border: none; border-radius: 10px; font-weight: 600; font-size: 1.05rem; cursor: pointer; transition: opacity 0.2s; letter-spacing: 1px; }
        .submit-btn:hover { opacity: 0.9; }

        .table-box { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
        th, td { padding: 18px 20px; text-align: left; }
        th { background: rgba(255, 255, 255, 0.02); color: var(--text-muted); font-weight: 600; font-size: 0.85rem; text-transform: uppercase; border-bottom: 1px solid var(--border-color); }
        td { border-bottom: 1px solid rgba(255, 255, 255, 0.03); color: #cbd5e1; }
        .delete-icon-btn { background: none; border: none; color: var(--text-negative); cursor: pointer; font-size: 1.1rem; }
        .loader { border: 4px solid #1e293b; border-top: 4px solid var(--accent-purple); border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 15px auto; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    </style>
</head>
<body>

<div class="container">
    <div class="header-section">
        <h1>INTP <span>財務戰情室</span></h1>
        <div class="exchange-badge"><i class="fa-solid fa-globe"></i> USD/TWD: <span id="currentRate">32.50</span></div>
    </div>
    
    <div class="dashboard">
        <div class="card" style="border-top: 4px solid var(--text-positive);">
            <h3><i class="fa-solid fa-vault" style="color:var(--text-positive)"></i> 總資產</h3>
            <div class="amount" id="displayAssets" style="color: var(--text-positive)">$0</div>
        </div>
        <div class="card" style="border-top: 4px solid var(--text-negative);">
            <h3><i class="fa-solid fa-credit-card" style="color:var(--text-negative)"></i> 總負債</h3>
            <div class="amount" id="displayLiabilities" style="color: var(--text-negative)">$0</div>
        </div>
        <div class="card" style="border-top: 4px solid var(--accent-purple);">
            <h3><i class="fa-solid fa-shield-halved" style="color:var(--accent-purple)"></i> 總淨資產</h3>
            <div class="amount" id="displayNetWorth" style="color: #fff">$0</div>
        </div>
        <div class="card" style="border-top: 4px solid var(--accent-blue);">
            <h3><i class="fa-solid fa-bolt"></i> 今日損益波動</h3>
            <div class="amount" id="displayDailyChange">$0</div>
        </div>
        <div class="card" style="border-top: 4px solid #f59e0b;">
            <h3><i class="fa-solid fa-chart-simple"></i> 資產日成長率</h3>
            <div class="amount" id="displayDailyGrowth">0%</div>
        </div>
    </div>

    <div class="milestone-section">
        <div class="panel-title"><i class="fa-solid fa-trophy" style="color:var(--accent-warning)"></i> 資產里程碑 (依總資產計算)</div>
        
        <div class="current-level-banner">
            <h4>目前等級</h4>
            <div class="title" id="msCurrentTitle">萌新投資人</div>
            <div class="desc" id="msCurrentDesc">打好基礎，建立理財習慣</div>
            <div style="font-size: 0.95rem; color: var(--accent-warning);">距離下一級還差: <span id="msGap" style="font-family: 'Poppins', sans-serif; font-weight: bold; font-size: 1.2rem;">$0</span></div>
        </div>

        <div class="stage-grid" id="stageGrid">
            </div>
    </div>
    
    <div class="charts-grid">
        <div class="chart-box">
            <div class="chart-title"><i class="fa-solid fa-chart-line" style="color:var(--accent-blue)"></i> 資產歷史走勢</div>
            <div style="flex-grow: 1; min-height: 280px;"><canvas id="financeChart"></canvas></div>
        </div>
        <div class="chart-box">
            <div class="chart-title"><i class="fa-solid fa-chart-pie" style="color:var(--text-positive)"></i> 資產類別佔比</div>
            <div class="donut-layout">
                <div class="donut-wrapper">
                    <canvas id="donutChart"></canvas>
                    <div class="donut-center">
                        <div class="label">Total</div>
                        <div class="val" id="donutTotalText">0W</div>
                    </div>
                </div>
                <ul class="custom-legend" id="donutLegend"></ul>
            </div>
        </div>
    </div>

    <div class="input-panel">
        <div class="panel-title"><i class="fa-solid fa-pen-to-square"></i> 快照同步中心</div>
        <div class="form-grid">
            <div class="input-field"><label>日期</label><input type="date" id="inputDate"></div>
            <div class="input-field"><label>台股 (TWD)</label><input type="number" id="inputTwStock" placeholder="0"></div>
            <div class="input-field"><label>美股 (USD 🇺🇸)</label><input type="number" id="inputUsStockUsd" placeholder="0"></div>
            <div class="input-field"><label>Crypto (USD ₿)</label><input type="number" id="inputCryptoUsd" placeholder="0"></div>
            <div class="input-field"><label>現金存款 (TWD)</label><input type="number" id="inputCash" placeholder="0"></div>
            <div class="input-field"><label>總負債 (TWD)</label><input type="number" id="inputLiabilities" placeholder="0"></div>
        </div>
        <button class="submit-btn" id="addBtn"><i class="fa-solid fa-cloud-arrow-up"></i> 同步至雲端戰情室</button>
    </div>

    <div id="loading" class="loader"></div>
    <div class="table-box">
        <table id="historyTable">
            <thead>
                <tr>
                    <th>日期</th><th>台股</th><th>美股 (TWD)</th><th>Crypto (TWD)</th><th>現金</th><th>總負債</th><th>總資產</th><th>淨資產</th><th>操作</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script>
(async function() { 
    // 密碼鎖
    const MY_PASSWORD_HASH = "a76631241a4ad4528be06e6f6112b7211a00cefac243a6e46e6dab61f592e861"; 
    async function sha256(message) {
        const msgBuffer = new TextEncoder().encode(message);
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }
    let userPass = prompt("🔒 請輸入戰情室密碼：");
    if (await sha256(userPass || "") !== MY_PASSWORD_HASH) {
        document.body.innerHTML = "<h1 style='color:#ff7597;text-align:center;margin-top:20%'>🚫 密碼錯誤，拒絕訪問</h1>";
        throw new Error("密碼錯誤"); 
    }

    // Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyC98g3JuqPtStZ4P25YZ8trqfWpUJss3vI",
        authDomain: "financial-records-76092.firebaseapp.com",
        projectId: "financial-records-76092",
        storageBucket: "financial-records-76092.firebasestorage.app",
        messagingSenderId: "327241339058",
        appId: "1:327241339058:web:9192aecef5ccaf22ccb9ab"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore(); 
    const COLLECTION_NAME = "finance_records"; 

    let lineChart, donutChart;
    document.getElementById('inputDate').valueAsDate = new Date();
    document.getElementById('loading').style.display = 'block';

    // 匯率
    let usdToTwdRate = 32.5; 
    fetch('https://open.er-api.com/v6/latest/USD')
        .then(res => res.json()).then(data => {
            usdToTwdRate = data.rates.TWD;
            document.getElementById('currentRate').innerText = usdToTwdRate.toFixed(2);
        }).catch(() => document.getElementById('currentRate').innerText = "32.50 (預設)");

// 🌟 里程碑資料 (純科重裝甲專屬版本)
const milestones = [
    { 
        name: "第一階段", 
        title: "破敵先鋒 (現階段)", 
        target: 500000, 
        color: "#10b981", 
        desc: "已達成半桶金！集中火力於科技與AI供應鏈，承受高波動換取高成長。保留實體現金防禦日本遠征與兵役空窗期。", 
        strategy: [ "<strong>台股純科 (0050/00881):</strong> 70%", "<strong>美股尖刀 (QQQ/NVDA):</strong> 20%", "<strong>實體現金:</strong> 10%" ] 
    },
    { 
        name: "第二階段", 
        title: "百萬指揮官", 
        target: 1000000, 
        color: "#38bdf8", 
        desc: "踏破百萬大關！接軌職場正職現金流，維持高純度科技陣型，並切出小資金狙擊高波動次產業。", 
        strategy: [ "<strong>美股尖刀 (QQQ/NVDA):</strong> 45%", "<strong>台股大盤 (0050/00881):</strong> 35%", "<strong>游擊部隊 (個股):</strong> 10%", "<strong>實體現金:</strong> 10%" ] 
    },
    { 
        name: "第三階段", 
        title: "資本擴張將軍", 
        target: 3000000, 
        color: "#f59e0b", 
        desc: "資產量體放大，稍微增厚裝甲防禦。以美股科技大盤為絕對核心，讓矽谷巨頭與AI幫你打工。", 
        strategy: [ "<strong>美股大盤/科技 (QQQ/VOO):</strong> 50%", "<strong>台股大盤/科技:</strong> 30%", "<strong>游擊部隊 (Crypto等):</strong> 10%", "<strong>現金/避震器:</strong> 10%" ] 
    },
    { 
        name: "第四階段", 
        title: "財富雪球霸主", 
        target: 5000000, 
        color: "#ff7597", 
        desc: "五百萬絕對領域！具備強大財務底氣，追求長期穩健資本利得與科技股配息現金流，邁向財務自由。", 
        strategy: [ "<strong>美股大盤/科技:</strong> 50%", "<strong>台股大盤/科技:</strong> 35%", "<strong>加密貨幣/高波資產:</strong> 5%", "<strong>戰略備用金:</strong> 10%" ] 
    }
];
    db.collection(COLLECTION_NAME).orderBy("date", "asc")
    .onSnapshot((querySnapshot) => {
        const financeData = [];
        querySnapshot.forEach((doc) => financeData.push({ id: doc.id, ...doc.data() }));
        document.getElementById('loading').style.display = 'none';
        renderTable(financeData);
        renderLineChart(financeData);
        renderDonutChart(financeData);
        updateDashboard(financeData);
        renderMilestones(financeData); 
    });

    document.getElementById('addBtn').addEventListener('click', function() {
        const date = document.getElementById('inputDate').value;
        const twStock = Number(document.getElementById('inputTwStock').value) || 0;
        const usStockTwd = Math.round((Number(document.getElementById('inputUsStockUsd').value) || 0) * usdToTwdRate);
        const cryptoTwd = Math.round((Number(document.getElementById('inputCryptoUsd').value) || 0) * usdToTwdRate);
        const cash = Number(document.getElementById('inputCash').value) || 0;
        const liabilities = Number(document.getElementById('inputLiabilities').value) || 0;
        const totalAssets = twStock + usStockTwd + cryptoTwd + cash;
        const netWorth = totalAssets - liabilities;

        if (!date) return alert("請選擇日期！");
        const btn = document.getElementById('addBtn');
        btn.disabled = true; btn.innerText = "雲端同步中...";

        db.collection(COLLECTION_NAME).add({
            date, twStock, usStock: usStockTwd, crypto: cryptoTwd, cash,
            assets: totalAssets, liabilities, netWorth, timestamp: new Date()
        }).then(() => {
            ['inputTwStock', 'inputUsStockUsd', 'inputCryptoUsd', 'inputCash', 'inputLiabilities'].forEach(id => document.getElementById(id).value = '');
        }).finally(() => { btn.disabled = false; btn.innerText = "同步至雲端戰情室"; });
    });

    window.deleteData = function(id) { if(confirm('確定刪除此筆快照？')) db.collection(COLLECTION_NAME).doc(id).delete(); };

    // 🌟 里程碑計算邏輯 (真實進度解鎖)
    function renderMilestones(data) {
        if (data.length === 0) return;
        const totalAssets = data[data.length - 1].assets || 0; 
        
        let currentStageIndex = 0;
        for(let i = 0; i < milestones.length; i++) {
            if (totalAssets < milestones[i].target) {
                currentStageIndex = i;
                break;
            }
            if (i === milestones.length - 1) currentStageIndex = i; 
        }

        const currentStage = milestones[currentStageIndex];
        document.getElementById('msCurrentTitle').innerText = currentStage.title;
        document.getElementById('msCurrentDesc').innerText = currentStage.desc;
        
        const gap = currentStage.target - totalAssets;
        document.getElementById('msGap').innerText = gap > 0 ? `$${gap.toLocaleString()}` : '已全數破關！';

        const stageGrid = document.getElementById('stageGrid');
        stageGrid.innerHTML = '';

        milestones.forEach((ms, index) => {
            // 🌟 核心修改：計算真實進度，超過 100% 則鎖定在 100%
            let rawPct = (totalAssets / ms.target) * 100;
            let pct = rawPct >= 100 ? 100 : rawPct;

            const isActive = index === currentStageIndex ? 'active' : '';
            const barColor = pct >= 100 ? '#10b981' : ms.color;
            const pctText = pct.toFixed(1) + '%';
            
            let strategiesHtml = '';
            ms.strategy.forEach(s => { strategiesHtml += `<li><i class="fa-solid fa-thumbtack" style="color:${ms.color}"></i> ${s}</li>`; });

            stageGrid.innerHTML += `
                <div class="stage-card ${isActive}">
                    <div class="stage-header">
                        <div class="stage-name" style="color:${ms.color}"><i class="fa-solid fa-medal"></i> ${ms.name}</div>
                        <div class="stage-target">${(ms.target / 10000)} 萬</div>
                    </div>
                    <div class="progress-info" style="color:${barColor}">達成率: ${pctText}</div>
                    <div class="progress-track">
                        <div class="progress-fill" style="width: ${pct}%; background-color: ${barColor};"></div>
                    </div>
                    <div style="font-size:0.85rem; color:#f1f5f9; margin-bottom:12px;">📌 目標：${ms.desc}</div>
                    <ul class="strategy-list">${strategiesHtml}</ul>
                </div>
            `;
        });
    }

    function updateDashboard(data) {
        if (data.length === 0) return;
        const latest = data[data.length - 1];
        const previous = data.length > 1 ? data[data.length - 2] : null;
        document.getElementById('displayAssets').innerText = `$${latest.assets.toLocaleString()}`;
        document.getElementById('displayLiabilities').innerText = `$${latest.liabilities.toLocaleString()}`;
        document.getElementById('displayNetWorth').innerText = `$${latest.netWorth.toLocaleString()}`;
        if (previous) {
            const dailyChange = latest.netWorth - previous.netWorth;
            const dailyGrowth = ((dailyChange / previous.netWorth) * 100).toFixed(2);
            document.getElementById('displayDailyChange').innerText = (dailyChange >= 0 ? '+' : '-') + `$${Math.abs(dailyChange).toLocaleString()}`;
            document.getElementById('displayDailyChange').style.color = dailyChange >= 0 ? 'var(--text-positive)' : 'var(--text-negative)';
            document.getElementById('displayDailyGrowth').innerText = (dailyGrowth >= 0 ? '+' : '') + dailyGrowth + '%';
            document.getElementById('displayDailyGrowth').style.color = dailyGrowth >= 0 ? 'var(--text-positive)' : 'var(--text-negative)';
        }
    }

    function renderTable(data) {
        const tbody = document.querySelector('#historyTable tbody');
        tbody.innerHTML = '';
        [...data].reverse().forEach(item => {
            const f = (val) => `$${(val || 0).toLocaleString()}`;
            tbody.innerHTML += `<tr><td>${item.date}</td><td>${f(item.twStock)}</td><td>${f(item.usStock)}</td><td>${f(item.crypto)}</td><td>${f(item.cash)}</td><td style="color:var(--text-negative)">${f(item.liabilities)}</td><td style="color:var(--text-positive)">${f(item.assets)}</td><td style="font-weight:700; color:#fff">${f(item.netWorth)}</td><td><button class="delete-icon-btn" onclick="deleteData('${item.id}')"><i class="fa-solid fa-trash-can"></i></button></td></tr>`;
        });
    }

    function renderDonutChart(data) {
        if (data.length === 0) return;
        const latest = data[data.length - 1];
        const assets = [latest.twStock||0, latest.usStock||0, latest.crypto||0, latest.cash||0];
        const total = assets.reduce((a,b)=>a+b, 0);

        document.getElementById('donutTotalText').innerText = total >= 10000 ? `${(total / 10000).toFixed(1)}W` : total.toLocaleString();

        const colors = ['#10b981', '#38bdf8', '#f59e0b', '#64748b'];
        const labels = ['台股', '美股', 'Crypto', '現金'];

        const legendEl = document.getElementById('donutLegend');
        legendEl.innerHTML = '';
        labels.forEach((name, i) => {
            const pct = total > 0 ? ((assets[i] / total) * 100).toFixed(1) : '0.0';
            // 只有非 0 的才顯示在側邊
            if(assets[i] > 0) {
                legendEl.innerHTML += `<li class="legend-row"><div><span class="legend-dot" style="background:${colors[i]}"></span><span class="legend-name">${name}</span></div><span class="legend-pct">${pct}%</span></li>`;
            }
        });

        const ctx = document.getElementById('donutChart').getContext('2d');
        if (donutChart) donutChart.destroy();
        donutChart = new Chart(ctx, {
            type: 'doughnut',
            data: { labels: labels, datasets: [{ data: assets, backgroundColor: colors, borderWidth: 0 }] },
            plugins: [ChartDataLabels],
            options: { 
                responsive: true, maintainAspectRatio: false, cutout: '75%', 
                plugins: { 
                    legend: { display: false }, 
                    tooltip: { enabled: true },
                    datalabels: {
                        color: '#fff',
                        font: { weight: 'bold', size: 11 },
                        formatter: (value, ctx) => {
                            let sum = 0;
                            let dataArr = ctx.chart.data.datasets[0].data;
                            dataArr.map(data => { sum += data; });
                            let percentage = (value * 100 / sum).toFixed(1);
                            return percentage > 5 ? ctx.chart.data.labels[ctx.dataIndex] + '\n' + percentage + "%" : '';
                        },
                        anchor: 'center',
                        align: 'center',
                        textAlign: 'center'
                    }
                } 
            }
        });
    }

    function renderLineChart(data) {
        const ctx = document.getElementById('financeChart').getContext('2d');
        if (lineChart) lineChart.destroy();
        lineChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: data.map(d => d.date),
                datasets: [
                    { label: '總資產', data: data.map(d => d.assets), borderColor: '#38bdf8', backgroundColor: 'rgba(56, 189, 248, 0.04)', fill: true, tension: 0.35, borderWidth: 2 },
                    { label: '淨資產', data: data.map(d => d.netWorth), borderColor: '#a855f7', borderDash: [4, 4], tension: 0.35, borderWidth: 2 },
                    { label: '總負債', data: data.map(d => d.liabilities), borderColor: '#ff7597', borderDash: [6, 6], tension: 0.35, borderWidth: 1.5 }
                ]
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: '#94a3b8', font: { size: 12 } } } }, scales: { x: { grid: { display: false }, ticks: { color: '#64748b', font: { size: 11 } } }, y: { grid: { color: 'rgba(255, 255, 255, 0.05)' }, ticks: { color: '#64748b', font: { size: 11 } } } } }
        });
    }
})();
</script>
</body>
</html>
