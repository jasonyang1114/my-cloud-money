<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INTP 雲端財務戰情室 V5.1</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        :root { --bg-color: #121212; --card-bg: #1e1e1e; --text-main: #e0e0e0; --text-sec: #a0a0a0; --accent: #bb86fc; --positive: #03dac6; --negative: #cf6679; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 1150px; width: 100%; }
        h1 { text-align: center; color: var(--accent); margin-bottom: 5px; }
        
        .exchange-rate-bar { text-align: center; color: var(--text-sec); font-size: 0.9rem; margin-bottom: 25px; }
        #currentRate { color: var(--positive); font-weight: bold; }

        /* 🌟 改回 5 欄位 */
        .dashboard { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 30px; }
        .card { background-color: var(--card-bg); padding: 15px; border-radius: 12px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.3); border-top: 3px solid var(--accent); }
        .card h3 { margin: 0 0 10px 0; font-size: 0.85rem; color: var(--text-sec); }
        .card .amount { font-size: 1.3rem; font-weight: bold; }
        
        .input-section { background-color: var(--card-bg); padding: 25px; border-radius: 12px; margin-bottom: 30px; }
        .form-group { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin-bottom: 15px; }
        .form-group label { font-size: 0.8rem; white-space: nowrap; display: block; margin-bottom: 6px; color: var(--text-sec); }
        input { background-color: #2c2c2c; border: 1px solid #333; color: white; padding: 10px; border-radius: 6px; width: 100%; box-sizing: border-box; font-size: 0.9rem; }
        button { background-color: var(--accent); color: black; border: none; padding: 12px 25px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.2s; }
        
        .charts-wrapper { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 30px; }
        .chart-container { background-color: var(--card-bg); padding: 20px; border-radius: 12px; height: 350px; position: relative; }
        .chart-header { margin-top: 0; color: var(--text-main); font-size: 1rem; margin-bottom: 15px; }
        
        .donut-center-text { position: absolute; top: 55%; left: 50%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; }
        .donut-center-text .title { font-size: 0.8rem; color: var(--text-sec); }
        .donut-center-text .amount { font-size: 1.4rem; font-weight: bold; color: var(--positive); }

        table { width: 100%; border-collapse: collapse; background-color: var(--card-bg); border-radius: 12px; overflow: hidden; font-size: 0.8rem; }
        th, td { padding: 12px 8px; text-align: left; border-bottom: 1px solid #333; }
        th { background-color: #2c2c2c; color: var(--accent); }
        .delete-btn { background-color: var(--negative); color: white; padding: 5px 10px; font-size: 0.75rem; border-radius: 4px; border: none; cursor: pointer; }
        .loader { border: 4px solid #333; border-top: 4px solid var(--accent); border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 20px auto; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        @media (max-width: 900px) { .form-group { grid-template-columns: repeat(3, 1fr); } .charts-wrapper { grid-template-columns: 1fr; } }
        @media (max-width: 768px) { .dashboard { grid-template-columns: repeat(2, 1fr); } .dashboard .card:first-child { grid-column: span 2; } .form-group { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body>

<div class="container">
    <h1>財務戰情室 V5.1</h1>
    <div class="exchange-rate-bar">💱 今日美金匯率 (USD→TWD)：<span id="currentRate">載入中...</span></div>
    
    <div class="dashboard">
        <div class="card"><h3>💰 總資產 (TWD)</h3><div class="amount" id="displayAssets" style="color: var(--positive)">$0</div></div>
        
        <div class="card" style="border-top-color: #cf6679;"><h3>💸 總負債 (TWD)</h3><div class="amount" id="displayLiabilities" style="color: var(--negative)">$0</div></div>
        
        <div class="card" style="border-top-color: #bb86fc;"><h3>🛡️ 總淨資產 (TWD)</h3><div class="amount" id="displayNetWorth">$0</div></div>
        <div class="card" style="border-top-color: #f59e0b;"><h3>🔥 今日損益波動</h3><div class="amount" id="displayDailyChange">$0</div></div>
        <div class="card" style="border-top-color: #8b5cf6;"><h3>📊 資產日成長率</h3><div class="amount" id="displayDailyGrowth">0%</div></div>
    </div>
    
    <div class="charts-wrapper">
        <div class="chart-container">
            <h3 class="chart-header">📈 資產歷史走勢</h3>
            <div style="height: 280px;"><canvas id="financeChart"></canvas></div>
        </div>
        <div class="chart-container">
            <h3 class="chart-header">📒 資產類別佔比</h3>
            <div style="height: 250px; position: relative;">
                <canvas id="donutChart"></canvas>
                <div class="donut-center-text">
                    <div class="title">Total</div>
                    <div class="amount" id="donutTotalText">$0</div>
                </div>
            </div>
        </div>
    </div>

    <div class="input-section">
        <h3 style="margin-top: 0; color: var(--accent);">📝 新增資產快照 (美股/Crypto 請輸入美元)</h3>
        <div class="form-group">
            <div><label>日期</label><input type="date" id="inputDate"></div>
            <div><label>台股 (TWD)</label><input type="number" id="inputTwStock" placeholder="0"></div>
            <div><label>美股 (USD 🇺🇸)</label><input type="number" id="inputUsStockUsd" placeholder="0"></div>
            <div><label>Crypto (USD ₿)</label><input type="number" id="inputCryptoUsd" placeholder="0"></div>
            <div><label>現金存款 (TWD)</label><input type="number" id="inputCash" placeholder="0"></div>
            <div><label>總負債 (TWD)</label><input type="number" id="inputLiabilities" placeholder="0"></div>
        </div>
        <button id="addBtn">同步至雲端戰情室</button>
    </div>

    <div id="loading" class="loader"></div>
    <table id="historyTable">
        <thead>
            <tr>
                <th>日期</th>
                <th>台股</th>
                <th>美股 (TWD)</th>
                <th>Crypto (TWD)</th>
                <th>現金</th>
                <th>總負債</th>
                <th>總資產</th>
                <th>淨資產</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<script>
(async function() { 
    // 密碼鎖
    const MY_PASSWORD_HASH = "a76631241a4ad4528be06e6f6112b7211a00cefac243a6e46e6dab61f592e861"; 
    async function sha256(message) {
        const msgBuffer = new TextEncoder().encode(message);
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }
    
    let userPass = prompt("🔒 請輸入戰情室密碼：");
    let inputHash = await sha256(userPass || ""); 
    if (inputHash !== MY_PASSWORD_HASH) {
        document.body.innerHTML = "<h1 style='color:#cf6679;text-align:center;margin-top:20%'>🚫 拒絕訪問：密碼錯誤</h1>";
        throw new Error("密碼錯誤"); 
    }

    // Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyC98g3JuqPtStZ4P25YZ8trqfWpUJss3vI",
        authDomain: "financial-records-76092.firebaseapp.com",
        projectId: "financial-records-76092",
        storageBucket: "financial-records-76092.firebasestorage.app",
        messagingSenderId: "327241339058",
        appId: "1:327241339058:web:9192aecef5ccaf22ccb9ab",
        measurementId: "G-S6Z26CCGJK"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore(); 
    const COLLECTION_NAME = "finance_records"; 

    let lineChart;
    let donutChart;
    document.getElementById('inputDate').valueAsDate = new Date();
    document.getElementById('loading').style.display = 'block';

    // 匯率
    let usdToTwdRate = 32.5; 
    fetch('https://open.er-api.com/v6/latest/USD')
        .then(res => res.json())
        .then(data => {
            usdToTwdRate = data.rates.TWD;
            document.getElementById('currentRate').innerText = usdToTwdRate.toFixed(2);
        })
        .catch(() => document.getElementById('currentRate').innerText = "使用預設 32.5");

    // 監聽
    db.collection(COLLECTION_NAME).orderBy("date", "asc")
    .onSnapshot((querySnapshot) => {
        const financeData = [];
        querySnapshot.forEach((doc) => {
            financeData.push({ id: doc.id, ...doc.data() });
        });
        document.getElementById('loading').style.display = 'none';
        renderTable(financeData);
        renderLineChart(financeData);
        renderDonutChart(financeData);
        updateDashboard(financeData);
    }, (error) => {
        document.getElementById('loading').style.display = 'none';
        alert("⚠️ Firebase 連線失敗，請檢查網路或權限規則！");
    });

    document.getElementById('addBtn').addEventListener('click', function() {
        const date = document.getElementById('inputDate').value;
        const twStock = Number(document.getElementById('inputTwStock').value) || 0;
        
        const usStockUsd = Number(document.getElementById('inputUsStockUsd').value) || 0;
        const cryptoUsd = Number(document.getElementById('inputCryptoUsd').value) || 0;
        const usStockTwd = Math.round(usStockUsd * usdToTwdRate);
        const cryptoTwd = Math.round(cryptoUsd * usdToTwdRate);
        
        const cash = Number(document.getElementById('inputCash').value) || 0;
        const liabilities = Number(document.getElementById('inputLiabilities').value) || 0;
        
        const totalAssets = twStock + usStockTwd + cryptoTwd + cash;
        const netWorth = totalAssets - liabilities;

        if (!date) { alert("請選擇日期！"); return; }

        const btn = document.getElementById('addBtn');
        btn.disabled = true;
        btn.innerText = "同步中...";

        db.collection(COLLECTION_NAME).add({
            date: date,
            twStock, usStock: usStockTwd, crypto: cryptoTwd, cash,
            assets: totalAssets, liabilities, netWorth: netWorth,
            timestamp: new Date()
        }).then(() => {
            ['inputTwStock', 'inputUsStockUsd', 'inputCryptoUsd', 'inputCash', 'inputLiabilities'].forEach(id => {
                document.getElementById(id).value = '';
            });
        }).finally(() => {
            btn.disabled = false;
            btn.innerText = "同步至雲端戰情室";
        });
    });

    window.deleteData = function(id) {
        if(confirm('確定刪除？')) db.collection(COLLECTION_NAME).doc(id).delete();
    };

    function updateDashboard(data) {
        if (data.length === 0) return;
        const latest = data[data.length - 1];
        const previous = data.length > 1 ? data[data.length - 2] : null;
        
        document.getElementById('displayAssets').innerText = `$${latest.assets.toLocaleString()}`;
        // 🌟 更新負債數字
        document.getElementById('displayLiabilities').innerText = `$${latest.liabilities.toLocaleString()}`;
        document.getElementById('displayNetWorth').innerText = `$${latest.netWorth.toLocaleString()}`;

        if (previous) {
            const dailyChange = latest.netWorth - previous.netWorth;
            const dailyGrowth = ((dailyChange / previous.netWorth) * 100).toFixed(2);
            const changeEl = document.getElementById('displayDailyChange');
            changeEl.innerText = (dailyChange >= 0 ? '+' : '-') + `$${Math.abs(dailyChange).toLocaleString()}`;
            changeEl.style.color = dailyChange >= 0 ? 'var(--positive)' : 'var(--negative)';
            
            const growthEl = document.getElementById('displayDailyGrowth');
            growthEl.innerText = (dailyGrowth >= 0 ? '+' : '') + dailyGrowth + '%';
            growthEl.style.color = dailyGrowth >= 0 ? 'var(--positive)' : 'var(--negative)';
        }
    }

    function renderTable(data) {
        const tbody = document.querySelector('#historyTable tbody');
        tbody.innerHTML = '';
        [...data].reverse().forEach(item => {
            const f = (val) => `$${(val || 0).toLocaleString()}`;
            tbody.innerHTML += `
                <tr>
                    <td>${item.date}</td>
                    <td>${f(item.twStock)}</td>
                    <td>${f(item.usStock)}</td>
                    <td>${f(item.crypto)}</td>
                    <td>${f(item.cash)}</td>
                    <td style="color:var(--negative)">${f(item.liabilities)}</td>
                    <td style="color:var(--positive)">${f(item.assets)}</td>
                    <td style="font-weight:bold">${f(item.netWorth)}</td>
                    <td><button class="delete-btn" onclick="deleteData('${item.id}')">刪除</button></td>
                </tr>`;
        });
    }

    function renderDonutChart(data) {
        if (data.length === 0) return;
        const latest = data[data.length - 1];
        const tw = latest.twStock || 0;
        const us = latest.usStock || 0;
        const cr = latest.crypto || 0;
        const ca = latest.cash || 0;
        const total = tw + us + cr + ca;

        document.getElementById('donutTotalText').innerText = total >= 10000 ? `$${(total / 10000).toFixed(1)}W` : `$${total.toLocaleString()}`;

        const ctx = document.getElementById('donutChart').getContext('2d');
        if (donutChart) donutChart.destroy();
        donutChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['台股', '美股', 'Crypto', '現金'],
                datasets: [{ data: [tw, us, cr, ca], backgroundColor: ['#2ecc71', '#00d2ff', '#f1c40f', '#95a5a6'], borderWidth: 0 }]
            },
            options: { responsive: true, maintainAspectRatio: false, cutout: '75%', plugins: { legend: { position: 'right', labels: { color: '#a0a0a0', font: { size: 10 } } } } }
        });
    }

    function renderLineChart(data) {
        const ctx = document.getElementById('financeChart').getContext('2d');
        if (lineChart) lineChart.destroy();
        lineChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: data.map(d => d.date),
                datasets: [
                    { label: '總資產', data: data.map(d => d.assets), borderColor: '#03dac6', backgroundColor: 'rgba(3,218,198,0.1)', fill: true, tension: 0.3 },
                    { label: '淨資產', data: data.map(d => d.netWorth), borderColor: '#bb86fc', borderDash: [3, 3] },
                    { label: '總負債', data: data.map(d => d.liabilities), borderColor: '#cf6679', borderDash: [5, 5] }
                ]
            },
            options: { responsive: true, maintainAspectRatio: false, scales: { x: { grid: { color: '#333' } }, y: { grid: { color: '#333' } } }, plugins: { legend: { labels: { color: '#a0a0a0' } } } }
        });
    }
})();
</script>
</body>
</html>
